
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F766E">

  <title>Personal Finance China</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;

    body {

      background: #f4f7f7;

      color: #172b2a;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      color: #647575;
      line-height: 1.6;
      font-size: 14px;
    }

    a {
      display: block;
      margin-top: 28px;
      padding: 16px;
      border-radius: 12px;
      background: #0F766E;
      color: white;
      text-decoration: none;
      font-weight: bold;

    .note {
      margin-top: 20px;
      font-size: 12px;
    }

<body>

    <a

    </p>
